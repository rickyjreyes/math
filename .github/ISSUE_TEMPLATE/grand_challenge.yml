name: "Reyes Problem Repository research contribution"
description: "GC01-GC300: report a proof, counterexample, prior-art result, or scoped task. Search existing GC issues first."
title: "[GCxx] "
body:
  - type: markdown
    attributes:
      value: |
        **Search the existing issues before submitting.** Comment on an existing GC task or link a PR when possible. This form is for a research finding that needs its own issue, not a duplicate canonical GC problem.
        Existing Lean proofs and papers stay in their original locations. See the [proof workflow](https://github.com/rickyjreyes/math/blob/main/reyes-problem-repository/WORKFLOW.md) and [research direction](https://github.com/rickyjreyes/math/blob/main/RESEARCH_DIRECTION.md). Mathematical verification helps test and develop the continuing WCT program, not declare physics validated or automatically refuted.
  - type: input
    id: gc_id
    attributes:
      label: "GC identifier"
      description: "Exact ID between GC01 and GC300."
      placeholder: "GC06"
    validations:
      required: true
  - type: input
    id: existing_issue
    attributes:
      label: "Existing related issue or PR"
      description: "Link the existing GC issue, related Lean issue or PR. Write none if you've searched and none applies."
      placeholder: "https://github.com/rickyjreyes/math/issues/55"
    validations:
      required: true
  - type: dropdown
    id: contribution
    attributes:
      label: "Contribution type"
      options:
        - "Prior mathematical result / literature correction"
        - "Counterexample / impossibility"
        - "Partial theorem or proof"
        - "Lean 4 formalization"
        - "Exact solution with Lean correspondence"
        - "Model or hypothesis correction"
        - "Numerical or physical falsification"
        - "Scope / adoption review"
    validations:
      required: true
  - type: textarea
    id: exact
    attributes:
      label: "Exact mathematical statement and scope"
      description: "Cite the GC file and identify the equation, parameter ranges, spaces, quantifiers, version and which obligations are addressed."
      placeholder: "Theorem under ... This resolves obligation A, but not B or C."
    validations:
      required: true
  - type: textarea
    id: existing_work
    attributes:
      label: "Prior Lean proofs, papers and existing results"
      description: "Link existing source modules and manuscripts first. Do not reprove or copy already verified theorems merely to satisfy this issue."
      placeholder: "Related module: lean/MathProofs/...; paper: papers/...; exact theorem declaration if known."
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: "Proof, counterexample, or evidence"
      description: "Link theorem declarations, proof commits, CI runs, exact earlier publications or reproducible calculations."
    validations:
      required: true
  - type: textarea
    id: inference_scope
    attributes:
      label: "Scope of theorem or obstruction"
      description: "Which exact construction or model class is proved or excluded? Does the finding genuinely reach a broader physical hypothesis? Do not infer theory-wide success or failure without evidence."
    validations:
      required: true
  - type: textarea
    id: constructive_next_test
    attributes:
      label: "Constructive next proof or discriminating test"
      description: "Specify the next theorem, model construction, or experiment if one exists, or state why no plausible route is known. A proposed repair is not yet a result."
    validations:
      required: false
  - type: textarea
    id: limitations
    attributes:
      label: "What remains unresolved"
      description: "Distinguish partial from full results, formal claims from paper discussion, and mathematical from physical evidence."
    validations:
      required: true
  - type: checkboxes
    id: integrity
    attributes:
      label: "Integrity and attribution"
      options:
        - label: "I searched existing issues, Lean sources and papers to avoid duplicate work."
          required: true
        - label: "I will not present a simulation, a narrower Lean theorem or a paper as verified resolution of a broader claim."
          required: true
