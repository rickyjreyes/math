name: F09 frozen Jacobian Lean source verification
on:
  pull_request:
    paths:
      - 'lean/MathProofs/V18*.lean'
      - 'lean/MathProofs.lean'
      - '.github/workflows/f09-derivative-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  f09:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Mathlib build cache
        run: |
          lake update
          lake exe cache get
      - name: Check unfinished proof markers
        run: |
          if grep -rnE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' MathProofs; then exit 1; fi
      - name: Kernel-check source derivative and determinant modules
        run: |
          lake build MathProofs.V18LightJacobian MathProofs.V18HeavyJacobian MathProofs.V18BlockJacobian MathProofs.V18MiddleJacobian MathProofs.V18MiddleDerivatives MathProofs.V18MiddleFloor
