name: Lean analytic cores (focused)
on:
  pull_request:
    paths:
      - 'lean/**'
      - '.github/workflows/lean-analytic-cores.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytic-cores:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib and its cache
        run: |
          lake update
          lake exe cache get
      - name: Reject unfinished proof markers
        run: |
          if grep -rnE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' \
            MathProofs/RemainingCores.lean \
            MathProofs/E16SpectralCore.lean \
            MathProofs/E62Discrete.lean \
            MathProofs/E58Sharpness.lean \
            MathProofs/E62Projector.lean \
            MathProofs/E62Continuous.lean \
            MathProofs/SpectralSharpness.lean \
            MathProofs/E26L2.lean \
            MathProofs/E62Torus1D.lean \
            MathProofs/E62TorusND.lean \
            MathProofs/E62ContinuumL2.lean \
            MathProofs/E58WholeSpaceL2.lean \
            MathProofs/E62ProjectorL2.lean \
            MathProofs/E26HistoricalCounterexample.lean \
            MathProofs/E17Canonical.lean \
            MathProofs/E26SeparatedL2.lean \
            MathProofs/E57WholeSpaceDamping.lean \
            MathProofs/E57SemigroupSymbol.lean \
            MathProofs/E16ModalPower.lean \
            MathProofs/E61WholeSpaceGrowth.lean \
            MathProofs/E62ProjectionOperator.lean \
            MathProofs/E62ParsevalProjectorBridge.lean; then exit 1; fi
      - name: Kernel check E16 exact modal power dominance
        run: lake build MathProofs.E16ModalPower
      - name: Kernel check E62 infinite-mode dependency first
        run: lake build MathProofs.E62Discrete
      - name: Kernel check existing E62 torus one-dimensional and coefficient projector
        run: lake build MathProofs.E62Projector MathProofs.E62Torus1D
      - name: Kernel check E62 torus Parseval/projector fraction correspondence
        run: lake build MathProofs.E62ParsevalProjectorBridge
      - name: Kernel check bounded E62 spectral projection and self-adjointness
        run: lake build MathProofs.E62ProjectionOperator
      - name: Kernel check higher-dimensional torus Fourier Parseval
        run: lake build MathProofs.E62TorusND
      - name: Kernel check whole-space E62 masked L2 classes
        run: lake build MathProofs.E62ContinuumL2
      - name: Kernel check whole-space E58 Fourier Green resolvent
        run: lake build MathProofs.E58WholeSpaceL2
      - name: Kernel check E61 whole-space growth bound
        run: lake build MathProofs.E61WholeSpaceGrowth
      - name: Kernel check E57 exact Fourier semigroup symbol
        run: lake build MathProofs.E57SemigroupSymbol
      - name: Kernel check E57 continuum L2 contraction
        run: lake build MathProofs.E57WholeSpaceDamping
      - name: Kernel check E26 historical denominator counterexample
        run: lake build MathProofs.E26HistoricalCounterexample
      - name: Kernel check E26 separated L2 membership
        run: lake build MathProofs.E26SeparatedL2
      - name: Kernel check corrected M2 E17 phase covariance
        run: lake build MathProofs.E17PhaseRegularizer
      - name: Kernel check true continuum E62 orthogonal projection
        run: lake build MathProofs.E62ProjectorL2 MathProofs.E17PhaseRegularizer
      - name: Kernel check analytic declarations
        run: |
          lake build MathProofs.RemainingCores MathProofs.E16SpectralCore \
            MathProofs.E62Discrete MathProofs.E58Sharpness \
            MathProofs.E62Projector MathProofs.E62Continuous \
            MathProofs.SpectralSharpness MathProofs.E26L2 \
            MathProofs.E62Torus1D MathProofs.E62TorusND \
            MathProofs.E62ContinuumL2 MathProofs.E58WholeSpaceL2 \
            MathProofs.E62ProjectorL2 MathProofs.E62ProjectionOperator \
            MathProofs.E62ParsevalProjectorBridge
