name: E68 whole-space gradient energy Lean proofs
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [proofs/e68-issue-41-sobolev]
permissions:
  contents: read
jobs:
  proofs:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        run: |
          lake update
          lake exe cache get
      - name: Forbid proof holes
        run: |
          if grep -rnE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' MathProofs/E68Scaling.lean MathProofs/E68CriticalGradient.lean MathProofs/E68SmoothProfiles.lean MathProofs/E68WeakH1.lean MathProofs/E68OneDimEnergy.lean MathProofs/E68HigherDimEnergy.lean MathProofs/E68ChangeVariables.lean MathProofs/E68ScaledGradient.lean; then exit 1; fi
      - name: Kernel-check exact issue modules
        run: lake build MathProofs.E68Scaling MathProofs.E68CriticalGradient MathProofs.E68SmoothProfiles MathProofs.E68WeakH1 MathProofs.E68OneDimEnergy MathProofs.E68HigherDimEnergy MathProofs.E68ChangeVariables MathProofs.E68ScaledGradient
      - name: Kernel-check complete project
        run: lake build
