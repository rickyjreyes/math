name: Focused F09-F10 Lean theorem check
on:
  pull_request:
    paths:
      - 'lean/MathProofs/V18*.lean'
      - 'lean/MathProofs/PolynomialFourier.lean'
      - 'lean/MathProofs/WeakFourierSpectrum.lean'
      - 'lean/MathProofs/WavepacketEnvelope.lean'
      - '.github/workflows/lean-f09-f10.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted-lean:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        run: |
          lake update
          lake exe cache get
      - name: Reject unfinished proof markers
        run: |
          if grep -rnE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' MathProofs; then exit 1; fi
      - name: Verify only the active unfinished theorem modules
        run: |
          lake build MathProofs.PolynomialFourier MathProofs.WeakFourierSpectrum MathProofs.WavepacketEnvelope MathProofs.V18LightJacobian MathProofs.V18HeavyJacobian MathProofs.V18BlockJacobian
