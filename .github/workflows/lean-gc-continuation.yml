name: GC06 GC16 GC01 bulk continuation exact audit
on:
  pull_request:
    paths:
      - 'lean/MathProofs/GC16BulkBinding.lean'
      - 'lean/MathProofs/GC16InterfaceBinding.lean'
      - 'lean/MathProofs/GC01ExpandedOrbits.lean'
      - 'lean/GC06GC16GC01ContinuationAudit.lean'
      - 'lean/scripts_audit/check_gc_continuation_axioms.py'
      - '.github/workflows/lean-gc-continuation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib cache
        run: lake exe cache get
      - name: Reject placeholders
        run: |
          if grep -nE '(^|[[:space:]])(sorry|admit|axiom)([[:space:]]|$)' MathProofs/GC16BulkBinding.lean MathProofs/GC01ExpandedOrbits.lean MathProofs/GC16InterfaceBinding.lean; then exit 1; fi
      - name: Build exact modules
        run: lake build MathProofs.GC16BulkBinding MathProofs.GC01ExpandedOrbits MathProofs.GC16InterfaceBinding
      - name: Audit exact roots
        run: |
          set -o pipefail
          lake env lean GC06GC16GC01ContinuationAudit.lean 2>&1 | tee gc-continuation-audit.log
          python scripts_audit/check_gc_continuation_axioms.py gc-continuation-audit.log
