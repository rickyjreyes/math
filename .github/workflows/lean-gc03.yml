name: GC03 focused Lean verification
on:
  pull_request:
    paths:
      - 'lean/MathProofs/GC03Energy.lean'
      - 'lean/MathProofs/CubicQuinticFlow.lean'
      - 'lean/MathProofs/FourierMultiplierL2.lean'
      - 'lean/GC03Audit.lean'
      - 'lean/scripts_audit/check_gc03_axioms.py'
      - '.github/workflows/lean-gc03.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  gc03:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        run: |
          lake update
          lake exe cache get
      - name: Reject unfinished proof markers
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' MathProofs/GC03Energy.lean; then exit 1; fi
      - name: Kernel check GC03 supporting roots
        run: lake build MathProofs.GC03Energy
      - name: Verify exact transitive axiom reports
        run: |
          set -o pipefail
          lake env lean GC03Audit.lean 2>&1 | tee gc03-audit.log
          python3 scripts_audit/check_gc03_axioms.py GC03Audit.lean gc03-audit.log
      - name: Preserve audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc03-audit
          path: lean/gc03-audit.log
          if-no-files-found: ignore
