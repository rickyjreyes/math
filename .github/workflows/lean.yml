name: Lean supporting theorems
on:
  push:
    branches: [main, proofs/m6b-issue-42-continuum]
    paths: ['lean/**', '.github/workflows/lean.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        run: |
          lake update
          lake exe cache get
      - name: Reject unfinished proof markers
        run: |
          if grep -rnE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' MathProofs; then exit 1; fi
      - name: Kernel check maintained declarations
        run: lake build
      - name: Confinement-chain dependency and axiom audit
        run: |
          lake env lean scripts_audit/DependencyAudit.lean 2>&1 | tee /tmp/audit.txt
          grep -q "ROOT ReyesMath.OrbitalStability.main" /tmp/audit.txt
          grep -o 'axioms: \[[^]]*\]' /tmp/audit.txt | sed 's/axioms: \[//; s/\]//' \
            | tr ',' '\n' | sed 's/ //g' | sort -u > /tmp/axioms.txt
          cat /tmp/axioms.txt
          if grep -vxE 'propext|Classical.choice|Quot.sound' /tmp/axioms.txt; then
            echo "Unexpected axiom in the confinement chain"; exit 1
          fi
