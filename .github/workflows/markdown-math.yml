name: GitHub Markdown math rendering

on:
  push:
    branches:
      - docs/github-markdown-math-rendering-2026-11-02
    paths:
      - scripts/fix_markdown_math.py
      - .github/workflows/markdown-math.yml
  pull_request:
    paths:
      - '**/*.md'
      - scripts/fix_markdown_math.py
      - .github/workflows/markdown-math.yml

permissions:
  contents: write

jobs:
  normalize-on-audit-branch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rewrite unambiguous LaTeX delimiters in every Markdown file
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix_markdown_math.py --write --report /tmp/math-before.json
          python3 scripts/fix_markdown_math.py --check --report /tmp/math-after.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- '*.md'; then
            git add -- '*.md'
            git commit -m 'docs: make repository LaTeX render in GitHub Markdown [skip ci]'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Preserve conversion audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-markdown-math-audit
          path: /tmp/math-*.json
          if-no-files-found: warn

  ensure-markdown-math:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm non-code Markdown contains no convertible LaTeX delimiters
        run: python3 scripts/fix_markdown_math.py --check
