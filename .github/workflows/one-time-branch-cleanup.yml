name: One-time guarded stale-branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-branch-cleanup.yml
permissions:
  contents: write
jobs:
  remove-stale-refs:
    if: github.repository == 'rickyjreyes/math'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify active work and remove only SHA-matched stale branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,sys,urllib.request,urllib.error,urllib.parse
          repo = "rickyjreyes/math"
          api = "https://api.github.com/repos/" + repo
          token = os.environ.get("GH_TOKEN")
          expected = json.loads("{\"add-e14-bandpass-lyapunov-proof\":\"2350f9d68c399cc27efaf05b35e3cbe8503eceba\",\"add-e68-localized-energy-estimate\":\"9c9a205484c13e5c0f4794a69adcdee6be71617f\",\"add-m3-e57-swift-hohenberg-proof\":\"ecbe80e1f5e15d24df5f3ac324b546205c3bcbe4\",\"codex/canonical-l2-fourier\":\"f79d43b0bdb5d1920f47c54e738f902b9b8ead22\",\"codex/manifold-scalar-metric\":\"0388d26401dd0120b7fe47e98982b19897a334c2\",\"formal/lean-core-theorems-2026-10-26\":\"594ddf0991a560c121f00ba7b87ccfb48fc71b45\",\"formalization/analytical-closures-20261026\":\"cede7e97d0272d69b380df3bf04f1f9f56b2a121\",\"formalization/branch-positivity-curvature-bound-20261026\":\"aa2f85152557908e2238b636fc57cffaad57093c\",\"formalization/claude-four-complete-20261026\":\"2dff0377a5a6536b2639101036fbfb749a248210\",\"formalization/continuous-phase-and-dispersion-20261026\":\"badb2dd29c0374c6ec0552ae66d0716c2b5e1d89\",\"formalization/expanded-theorem-coverage-20261026\":\"c2bd73d7e71292051a6f5b1cd96de66dfa8b3783\",\"formalization/f09-full-forward-certificate-20261027\":\"902382612783cd26444178bb0892f03946a4bba7\",\"formalization/f09-v18-forward-20261027\":\"58f7792d3c517cbffb08773eeaf3ad9d3e613f8d\",\"formalization/fourier-leakage-and-l2-20261026\":\"1bb5d5003a4f9115b58cf41fd35f962a99dc5c2c\",\"formalization/full-core-theorems-20261026\":\"07adb5276c16fcee09370aa69e3f35f7ad4968e1\",\"formalization/intrinsic-tensor-20261027\":\"2398b05787cae5a76fcb8249b8b1bf2e5f7c284e\",\"formalization/missing-nine-proof-cores-20261026\":\"315468977a7032266547f04c1adba68f692a7286\",\"formalization/remaining-12-14-20261027\":\"87e94aafbe4408d59e718a4c4d2ddc3c40142d21\",\"formalization/strict-binding-20261026\":\"c4b9334f5b99955ec09fa71a65392b9fa0e0aa25\",\"formalization/uv-spectral-polynomial-obstruction-20261026\":\"99c952a936421b10def1e8aeb999d04c6e34b880\",\"formalization/uv-wholespace-negative-energy-20261026\":\"e3e82afbd7e6e516539e0684152031f325a2a42b\",\"formalization/verified-fourier-leakage-20261026\":\"431b84a1571f963362d06dfb359350386bf46b30\",\"index-m3-e57-swift-hohenberg-proof\":\"cba94dce76029db19e984e9f5e4dd34d53692099\",\"integration/f09-frozen-forward-model-20261027\":\"b0b47d43d63f0e29013eadd04d50650df9d494a7\",\"integration/f09-verified-source-derivatives-20261027\":\"ef66bdf4171bae4bb920e0c37cd3498d7289c2d6\",\"integration/f10-fourier-shell-20261027\":\"b2204a9388ce26ed9e1b24cc35416567f6ec9f0b\",\"integration/merge-lean-theorems-to-main-20261027\":\"ce7bf46eb24d95cdf6ae508011ac4da9f4bd554c\",\"integration/verified-f08-f10-20261027\":\"c91db89441e875feb8569c3f364a6e8fd315a44d\",\"integration/verified-f09-f10-subresults-20261027\":\"fd3c3500fb508f844b926b1f8be3165ddfa047cd\",\"proofs/remaining-seven-2026-10-26\":\"37710f55725478d09e9aa3d180ebafbeff523007\"}")
          preserve = {"main", "claude/zen-cerf-3jkydc", "formalization/f09-middle-rigorous-bounds-20261027", "formalization/remaining-analytic-cores-20261027"}
          if not token or os.environ.get("GITHUB_REPOSITORY") != repo: raise SystemExit("ERROR: missing GitHub token or wrong repository")
          headers = {"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"one-time-branch-cleanup"}
          def request(method,path):
              req=urllib.request.Request("https://api.github.com"+path, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data=resp.read()
                  return json.loads(data) if data else {}
          info=request("GET", "/repos/"+repo)
          if info["default_branch"] != "main": raise SystemExit("ERROR: default branch no longer main")
          prs=request("GET", "/repos/"+repo+"/pulls?state=open&per_page=100")
          if len(prs)>=100: raise SystemExit("ERROR: pull request list may be incomplete")
          active={p["head"]["ref"] for p in prs if p["head"]["repo"] and p["head"]["repo"]["full_name"]==repo}
          print("Preserving default/active PR branches:", sorted(active|preserve),flush=True)
          if active & expected.keys(): raise SystemExit("ERROR: tracked-for-delete branch now has active PR; refusing entire cleanup")
          branches=request("GET", "/repos/"+repo+"/branches?per_page=100")
          if len(branches)>=100: raise SystemExit("ERROR: branch pagination not exhaustive")
          live={b["name"]:b["commit"]["sha"] for b in branches}
          if len(expected)!=30 or not all(len(s)==40 for s in expected.values()): raise SystemExit("ERROR: malformed branch audit")
          deleted,skipped=[],[]
          for name,sha in sorted(expected.items()):
              if name in preserve or name in active:
                  skipped.append((name,"protected"))
                  continue
              if live.get(name)!=sha:
                  skipped.append((name,"SHA changed or branch gone"))
                  continue
              ref="/repos/"+repo+"/git/refs/heads/"+urllib.parse.quote(name,safe="/")
              try:
                  current=request("GET","/repos/"+repo+"/git/ref/heads/"+urllib.parse.quote(name,safe="/"))
                  if current["object"]["sha"]!=sha:
                      skipped.append((name,"SHA changed since check"));continue
                  request("DELETE",ref)
                  deleted.append(name)
                  print("DELETED:",name,flush=True)
              except urllib.error.HTTPError as e:
                  skipped.append((name,"HTTP "+str(e.code)))
                  print("FAILED:",name,e.code,flush=True)
          print("RESULT:",json.dumps({"deleted_count":len(deleted),"skipped":skipped,"deleted":deleted}),flush=True)
          if skipped: sys.exit(1)
          
          PY
