name: Build and publish PDFs
on:
  push:
    branches: [main]
    paths:
      - 'papers/**'
      - 'overview.tex'
      - 'scripts/build_pdfs.sh'
      - '.github/workflows/pdfs.yml'
  pull_request:
  workflow_dispatch:
concurrency:
  group: pdf-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Compile all manuscripts
        run: bash scripts/build_pdfs.sh
      - name: Verify PDFs
        run: |
          expected="$(find papers -mindepth 2 -maxdepth 2 -name main.tex | wc -l)"
          actual="$(find preprints -mindepth 2 -maxdepth 2 -name paper.pdf | wc -l)"
          test "$actual" -eq "$expected"
          test -s overview.pdf
      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: math-pdfs
          path: |
            overview.pdf
            preprints/*/paper.pdf
          if-no-files-found: error
      - name: Commit PDFs to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f overview.pdf preprints/*/paper.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish manuscript PDFs [skip ci]'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            exit 1
          fi
