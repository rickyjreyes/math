name: Certified v18 analytic Jacobian rank
on:
  pull_request:
    paths:
      - 'scripts/v18_analytic_rank_certificate.py'
      - 'docs/SM_V18_ANALYTIC_RANK_CERTIFICATE.md'
      - '.github/workflows/v18-rank.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-minor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install interval arithmetic and frozen-model dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'mpmath==1.3.0'
      - name: Fetch pinned original v18 implementation
        uses: actions/checkout@v4
        with:
          repository: rickyjreyes/geometry_of_resonance
          ref: 5a4c58a4206005ad9d46ee2951069186490b01f1
          path: pinned-geometry-of-resonance
          persist-credentials: false
      - name: Verify actual coefficient source and analytic nonzero 11x11 minor
        run: |
          python scripts/v18_analytic_rank_certificate.py \
            --source pinned-geometry-of-resonance/SM_Spectrum/_terms_perfection_v18.py
