schema_version: 2
source: rickyjreyes/math
lean_release: v4.23.0
mathlib_release: v4.23.0
scope: >
  Local finite-dimensional, continuous integral variational, measure-theoretic, and polynomial-algebra results are encoded
  in Lean. Continuous PDE, dynamics, Gaussian variational constructions,
  and other analytic main results are NOT thereby kernel-checked.
proof_policy:
  build: "cd lean && lake update && lake exe cache get && lake build"
  excluded: ["sorry", "admit", "axiom"]
  note: "Passing CI certifies only the precise statements in the imported Lean source."
families:
  F01:
    main_theorem_formalized: false
    covered: "Exact cubic–quintic potential completion of the square/lower bound, sufficient strict-specific-energy-to-binding implication, and exact Gaussian energy-coefficient signs and optimized negative scale energy. The H² infimum-specific-energy estimate, Gaussian norm integrals, concentration–compactness, and flow stability are NOT formalized."
    declarations: [ReyesMath.negativeEnergy_strictGap, ReyesMath.cubic_quintic_potential_square, ReyesMath.cubic_quintic_potential_lower, ReyesMath.strict_binding_of_specific_energy, ReyesMath.gaussian_coefficient_c2_negative, ReyesMath.gaussian_coefficient_c4_positive, ReyesMath.quadratic_trial_energy_negative, ReyesMath.gaussian_trial_polynomial_certificate]
  F02:
    main_theorem_formalized: false
    covered: "S004 acceleration Hessian determinant, explicitly invertible four-constraint canonical Dirac bracket, conditional four-DOF arithmetic, exact UV dispersion roots, and quantitative σ(q)≥√q/4 for q≥4. Full physical Hamiltonian preservation/no-secondary-constraints verification and unbounded Sobolev evolution operator remain open."
    declarations: [ReyesMath.s004_acceleration_hessian_det, ReyesMath.s004_acceleration_hessian_det_pos, ReyesMath.ultraviolet_plus_root_exact, ReyesMath.ultraviolet_minus_root_exact, ReyesMath.s004_dirac_bracket_left_inverse, ReyesMath.s004_dirac_bracket_right_inverse, ReyesMath.s004_four_constraint_bracket_nondegenerate, ReyesMath.s004_four_dof_arithmetic, ReyesMath.uv_growth_squared_lower, ReyesMath.uv_growth_linear_in_wavenumber]
  F03:
    main_theorem_formalized: false
    covered: "Finite weighted variance and true continuous normalized weighted-variance identity for Bochner integrals. Periodic eigenfunction identity, polar amplitude derivative, and integration by parts are still unformalized."
    declarations: [ReyesMath.varianceDeficit_nonnegative, ReyesMath.finite_weighted_variance_identity, ReyesMath.finite_weighted_mean_square_bound, ReyesMath.continuous_normalized_weighted_variance]
  F04:
    main_theorem_formalized: false
    covered: "Coordinatewise multidimensional escape, exact extremal-convolution uniqueness for any separating functional, impossibility of cubic cancellation at escaped frequency, and nonzero complex extremal coefficient. Full torus Fourier-convolution operator identity, dynamics and local solution Fourier differentiability remain."
    declarations: [ReyesMath.quintic_frequency_above_cutoff, ReyesMath.quintic_frequency_below_cutoff, ReyesMath.multidimensional_quintic_frequency_escape, ReyesMath.quintic_extremal_convolution_unique, ReyesMath.cubic_cannot_reach_quintic_extreme, ReyesMath.quintic_extremal_coefficient_nonzero]
  F05:
    main_theorem_formalized: false
    covered: "Exact pointwise regularized curvature weight has positive denominator, nonnegative/strict-positive sign, and an abstract no-minimizer step conditional on arbitrarily small fixed-mass competitors. Actual H² mass-preserving dilation, F global boundedness and whole-space functional nonattainment remain unformalized."
    declarations: [ReyesMath.curvature_weight_denominator_positive, ReyesMath.curvature_weight_nonnegative, ReyesMath.curvature_weight_positive, ReyesMath.no_positive_mass_minimizer_of_spreading]
  F06:
    main_theorem_formalized: false
    covered: "The explicit positive stationary wavenumber, its tangent sign, and unique global squared-frequency minimum on the entire nonnegative real-domain are formalized, including the original physical K,T,G,m specialization. The PDF additionally claims strict second-derivative convexity, exact real-domain endpoint, and positivity of both squared-frequency roots; those stronger corollaries are not yet formalized."
    declarations: [ReyesMath.dispersion_discriminant_identity, ReyesMath.dispersion_tangent_square_identity, ReyesMath.dispersion_unique_minimum_at_stationary, ReyesMath.finite_scale_positive_stationary_exists, ReyesMath.finite_scale_explicit_global_minimum, ReyesMath.finite_scale_physical_unique_global_minimum]
  F07:
    main_theorem_formalized: false
    covered: "The continuous measure-theoretic weighted square completion, exact fixed-integral gap, sharp lower bound, explicit attaining mismatch, and a.e. equality-case uniqueness are formalized. Remaining: the H¹ real phase lift on a closed interval, exact winding endpoint condition, and phase uniqueness modulo constants."
    declarations: [ReyesMath.squaredMismatch_nonnegative, ReyesMath.finite_weighted_phase_bound, ReyesMath.finite_weighted_phase_remainder, ReyesMath.finite_weighted_phase_exact_gap, ReyesMath.finite_weighted_phase_sharp_bound, ReyesMath.continuous_phase_square_pointwise, ReyesMath.continuous_phase_square_integral, ReyesMath.continuous_phase_exact_gap, ReyesMath.continuous_phase_lower_bound, ReyesMath.continuous_phase_optimal_mismatch_exists, ReyesMath.continuous_phase_minimizer_ae_unique]
  F08:
    main_theorem_formalized: false
    algebraic_no_go_core_formalized: true
    covered: "Actual differentiable complex field on Euclidean 4-charts and arbitrary four-chart spaces: tensor equals Gram matrix, rank ≤2, and exact matrix contraction is nonnegative. Arbitrary nonnegative weighted carriers also covered. Coordinate-independent global tensor bundle construction and smooth chart-transition covariance are not formalized."
    declarations: [ReyesMath.scalarGradientGram_nonnegative, ReyesMath.scalarGradientGram_psd, ReyesMath.scalarGradientGram_no_timelike, ReyesMath.scalarGradientCarrier_gram_entry, ReyesMath.scalarGradientCarrier_rank_le_two, ReyesMath.positive_weighted_gradient_family_psd, ReyesMath.gradient_gram_rank_le_carriers, ReyesMath.complex_gradient_real_identity, ReyesMath.complex_gradient_tensor_eq_gram, ReyesMath.complex_gradient_tensor_rank_le_two, ReyesMath.complex_field_metric_is_gram, ReyesMath.complex_field_metric_rank_le_two, ReyesMath.complex_field_metric_quadratic_nonnegative, ReyesMath.complex_field_metric_no_timelike, ReyesMath.charted_complex_metric_rank_le_two, ReyesMath.charted_complex_metric_no_timelike, ReyesMath.charted_complex_metric_everywhere_obstruction, ReyesMath.charted_complex_metric_matrix_psd, ReyesMath.charted_complex_metric_full_pointwise_obstruction, ReyesMath.gradient_gram_matrix_quadratic, ReyesMath.complex_field_matrix_psd, ReyesMath.complex_field_matrix_no_timelike]
  F09:
    main_theorem_formalized: false
    matrix_nullity_core_formalized: true
    covered: "Any real 11-by-31 matrix has at least 20 kernel dimensions; extended to the Fréchet derivative of any differentiable 31-to-11 map. Model-specific Jacobian and measured numerical rank 11 remain outside Lean."
    declarations: [ReyesMath.elevenByThirtyone_nullity_bound, ReyesMath.nullityBound_arithmetic, ReyesMath.elevenByThirtyOne_matrix_nullity, ReyesMath.rectangular_sensitivity_nullity, ReyesMath.differential_local_identifiability_obstruction]
  F10:
    main_theorem_formalized: false
    covered: "Arbitrary-dimensional null Fourier sphere and vanishing a.e. Fourier representative. A full Fourier inversion/nonlocalization proof is now formalized for Schwartz-class fields using Mathlib's actual Schwartz Fourier equivalence. Extension to arbitrary L² states via Plancherel remains open."
    declarations: [ReyesMath.zero_ae_of_null_support, ReyesMath.oneDimensional_shell_ae_zero, ReyesMath.euclidean_frequency_shell_measure_zero, ReyesMath.euclidean_frequency_shell_ae_zero, ReyesMath.schwartz_fourier_shell_no_bound_state]
  F11:
    main_theorem_formalized: false
    covered: "E13/E14 band-pass gradient-flow identity and E62 Fourier energy fraction proved analytically; neither main result is Lean-formalized."
    declarations: []
  F12:
    main_theorem_formalized: false
    covered: "E26 historical additive-denominator conditional L2 estimate and counterexample proved analytically; no Lean encoding. The corrected M2/E17 regularization is a separate operator."
    declarations: []
