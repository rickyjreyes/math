schema_version: 2
source: rickyjreyes/math
lean_release: v4.23.0
mathlib_release: v4.23.0
scope: >
  Local finite-dimensional, continuous integral variational, measure-theoretic, and polynomial-algebra results are encoded
  in Lean. Some continuous PDE and Sobolev results are now kernel-checked, including negative constrained
  energy and UV ill-posedness. Infinite-dimensional variational binding, minimizer attainment,
  orbital stability, curvature nonattainment, and the L² Fourier-shell theorem remain open.
proof_policy:
  build: "cd lean && lake update && lake exe cache get && lake build"
  excluded: ["sorry", "admit", "axiom"]
  note: "Passing CI certifies only the precise statements in the imported Lean source."
families:
  F01:
    main_theorem_formalized: false
    negative_constrained_energy_formalized: true
    covered: "NegativeEnergy.negative_constrained_energy is kernel-checked: on Sobolev.H2 (Schwartz graph closure of u, grad u and Δu in genuine whole-space L²), for β,γ,m>0 and any k, -(3β²/(16γ))m ≤ I(m)<0. Exact smooth compactly supported anisotropic oscillatory trial (not the PDF's Gaussian), mass, kinetic, L4 and L6 integrals, and scaling are proved. SobolevH2 also formalizes true H² differentiation and mass-preserving dilation. Still OPEN: strict binding, attainment, concentration–compactness and orbital stability, including extension/identification of this graph model with an independently defined Sobolev H² if required."
    declarations: [ReyesMath.negativeEnergy_strictGap, ReyesMath.cubic_quintic_potential_square, ReyesMath.cubic_quintic_potential_lower, ReyesMath.strict_binding_of_specific_energy, ReyesMath.gaussian_coefficient_c2_negative, ReyesMath.gaussian_coefficient_c4_positive, ReyesMath.quadratic_trial_energy_negative, ReyesMath.gaussian_trial_polynomial_certificate, ReyesMath.NegativeEnergy.negative_constrained_energy, ReyesMath.NegativeEnergy.exists_negative, ReyesMath.Sobolev.H2.M_dil, ReyesMath.Sobolev.H2.K_dil, ReyesMath.Sobolev.H2.D_dil]
  F02:
    main_theorem_formalized: true
    s004_regular_constraint_count_formalized: true
    uv_spectral_no_polynomial_loss_formalized: true
    uv_sobolev_fourjet_formalized: true
    covered: "S004 regular fixed-flat-background canonical four-DOF constraint-count proof remains verified. UVIllPosedness and UVWholeSpace now prove the precise separate UV PDE theorems: real smooth exact solutions, unstable roots, positive-time Fourier mode/packet growth, explicit H^r four-jet norms on flat tori and whole ℝ^d, sequences whose initial X_{r+ℓ}-norm tends to zero while terminal X_r-norm is one, and no bounded extension for any fixed finite derivative loss. Parameters include K>0 and 4KT-G²>0; the manuscript's normalized wave equation follows as a corollary. No implication of a healthy full nonlinear S004 field theory."
    declarations: [ReyesMath.s004_acceleration_hessian_det, ReyesMath.s004_acceleration_hessian_det_pos, ReyesMath.ultraviolet_plus_root_exact, ReyesMath.ultraviolet_minus_root_exact, ReyesMath.s004_dirac_bracket_left_inverse, ReyesMath.s004_dirac_bracket_right_inverse, ReyesMath.s004_four_constraint_bracket_nondegenerate, ReyesMath.s004_four_dof_arithmetic, ReyesMath.uv_growth_squared_lower, ReyesMath.uv_growth_linear_in_wavenumber, ReyesMath.ultraviolet_exponential_outgrows_polynomial, ReyesMath.ultraviolet_no_finite_polynomial_loss, ReyesMath.S004.constraint_count, ReyesMath.S004.diracMatrix_det, ReyesMath.S004.no_secondary_constraints, ReyesMath.S004.charge_not_constraint, ReyesMath.UVIllPosed.torus_no_bounded_linear_extension, ReyesMath.UVIllPosed.wave_torus_unbounded, ReyesMath.UVIllPosed.whole_no_bounded_linear_extension, ReyesMath.UVIllPosed.wave_whole_unbounded]
  F03:
    main_theorem_formalized: true
    covered: "SpectralPhaseIdentity formalizes the full periodic C² eigenfunction polar identity with integral integration by parts, equality criterion, global C¹ polar lift for nowhere-vanishing fields, the χ=cos(s)+i a sin(s) family and exact 4/5 counterexample, including the closed planar geometric curvature construction."
    declarations: [ReyesMath.varianceDeficit_nonnegative, ReyesMath.finite_weighted_variance_identity, ReyesMath.finite_weighted_mean_square_bound, ReyesMath.continuous_normalized_weighted_variance, ReyesMath.SpectralPhase.sharp_spectral_phase_decomposition, ReyesMath.SpectralPhase.root_identity, ReyesMath.SpectralPhase.four_fifths, ReyesMath.SpectralPhase.geometric_lock_four_fifths]
  F04:
    main_theorem_formalized: false
    classical_solution_leakage_formalized: true
    covered: "FourierLeakage establishes genuine multidimensional torus Fourier integrals and orthogonality, diagonal fourth-order Laplacian, exact cubic–quintic Fourier convolution and escaped mode, derivative of Fourier coefficients for classical solutions, instant non-invariance for every such solution launched from multimode data, fifth-harmonic example, and exact single-mode solutions. Local existence and uniqueness of classical solutions for arbitrary smooth multimode initial data remain unformalized. Hence unconditional PDE flow-invariance classification in the PDF is not yet kernel-checked."
    declarations: [ReyesMath.quintic_frequency_above_cutoff, ReyesMath.quintic_frequency_below_cutoff, ReyesMath.multidimensional_quintic_frequency_escape, ReyesMath.quintic_extremal_convolution_unique, ReyesMath.cubic_cannot_reach_quintic_extreme, ReyesMath.quintic_extremal_coefficient_nonzero, ReyesMath.FourierLeakage.universal_leakage, ReyesMath.FourierLeakage.no_multimode_invariance, ReyesMath.FourierLeakage.fifth_harmonic, ReyesMath.FourierLeakage.singleMode_isClassicalSolution]
  F05:
    main_theorem_formalized: false
    covered: "Corrected curvature weight has positive denominator, nonnegative/strict-positive sign, and an explicit global finite uniform bound F(s)≤1+(ε²exp(-2α))^-2 for ε>0, α≥0, all s≥0. Also abstract no-minimizer implication assuming arbitrarily low fixed-mass energies. Whole-space H² field dilation, positive energy/infimum proof and no-attainment are unformalized."
    declarations: [ReyesMath.curvature_weight_denominator_positive, ReyesMath.curvature_weight_nonnegative, ReyesMath.curvature_weight_positive, ReyesMath.no_positive_mass_minimizer_of_spreading, ReyesMath.positive_curvature_weight_uniform_bound]
  F06:
    main_theorem_formalized: true
    covered: "DispersionMinimum formalizes the complete main theorem under exact original K,T,G,m hypotheses, including exact quadratic roots, nonnegative real-domain endpoint, explicit unique positive global minimizer, literal second derivative and positive strict convexity, branch positivity, exact minimum-frequency formula, sharp initial-slope criterion and wavenumber second-derivative statement."
    declarations: [ReyesMath.dispersion_discriminant_identity, ReyesMath.dispersion_tangent_square_identity, ReyesMath.dispersion_unique_minimum_at_stationary, ReyesMath.finite_scale_positive_stationary_exists, ReyesMath.finite_scale_explicit_global_minimum, ReyesMath.finite_scale_physical_unique_global_minimum, ReyesMath.physical_dispersion_both_branches_positive, ReyesMath.dispersion_real_domain_endpoint, ReyesMath.Dispersion.exact_positive_wavenumber_minimum, ReyesMath.Dispersion.zMinus_second_deriv, ReyesMath.Dispersion.exact_minimum_frequency, ReyesMath.Dispersion.sharp_initial_slope_criterion, ReyesMath.Dispersion.wavenumber_minimum]
  F07:
    main_theorem_formalized: true
    covered: "PhaseLockingContinuous formalizes a real H¹ phase via its absolutely continuous representative with L² derivative, winding endpoint constraint, actual derivative a.e., bounded positive measurable weight, exact continuous minimizer, sharp energy identity, a.e. optimal-gradient uniqueness and phase uniqueness up to constants, sector-selection/tie criteria and uniform-weight example."
    declarations: [ReyesMath.squaredMismatch_nonnegative, ReyesMath.finite_weighted_phase_bound, ReyesMath.finite_weighted_phase_remainder, ReyesMath.finite_weighted_phase_exact_gap, ReyesMath.finite_weighted_phase_sharp_bound, ReyesMath.continuous_phase_square_pointwise, ReyesMath.continuous_phase_square_integral, ReyesMath.continuous_phase_exact_gap, ReyesMath.continuous_phase_lower_bound, ReyesMath.continuous_phase_optimal_mismatch_exists, ReyesMath.continuous_phase_minimizer_ae_unique, ReyesMath.phase_locking_exact_minimum, ReyesMath.lockingEnergy_eq_min_iff, ReyesMath.exact_lock_criterion, ReyesMath.optimalPhase_second_variation, ReyesMath.sector_selection]
  F08:
    main_theorem_formalized: false
    algebraic_no_go_core_formalized: true
    covered: "Actual differentiable complex field on Euclidean 4-charts and arbitrary four-chart spaces: tensor equals Gram matrix, rank ≤2, and exact matrix contraction is nonnegative. Arbitrary nonnegative weighted carriers also covered. Coordinate-independent global tensor bundle construction and smooth chart-transition covariance are not formalized."
    declarations: [ReyesMath.scalarGradientGram_nonnegative, ReyesMath.scalarGradientGram_psd, ReyesMath.scalarGradientGram_no_timelike, ReyesMath.scalarGradientCarrier_gram_entry, ReyesMath.scalarGradientCarrier_rank_le_two, ReyesMath.positive_weighted_gradient_family_psd, ReyesMath.gradient_gram_rank_le_carriers, ReyesMath.complex_gradient_real_identity, ReyesMath.complex_gradient_tensor_eq_gram, ReyesMath.complex_gradient_tensor_rank_le_two, ReyesMath.complex_field_metric_is_gram, ReyesMath.complex_field_metric_rank_le_two, ReyesMath.complex_field_metric_quadratic_nonnegative, ReyesMath.complex_field_metric_no_timelike, ReyesMath.charted_complex_metric_rank_le_two, ReyesMath.charted_complex_metric_no_timelike, ReyesMath.charted_complex_metric_everywhere_obstruction, ReyesMath.charted_complex_metric_matrix_psd, ReyesMath.charted_complex_metric_full_pointwise_obstruction, ReyesMath.gradient_gram_matrix_quadratic, ReyesMath.complex_field_matrix_psd, ReyesMath.complex_field_matrix_no_timelike]
  F09:
    main_theorem_formalized: false
    matrix_nullity_core_formalized: true
    covered: "Any real 11-by-31 matrix has at least 20 kernel dimensions; extended to the Fréchet derivative of any differentiable 31-to-11 map. Model-specific Jacobian and measured numerical rank 11 remain outside Lean."
    declarations: [ReyesMath.elevenByThirtyone_nullity_bound, ReyesMath.nullityBound_arithmetic, ReyesMath.elevenByThirtyOne_matrix_nullity, ReyesMath.rectangular_sensitivity_nullity, ReyesMath.differential_local_identifiability_obstruction]
  F10:
    main_theorem_formalized: false
    covered: "Arbitrary-dimensional null Fourier sphere and vanishing a.e. Fourier representative. A full Fourier inversion/nonlocalization proof is now formalized for Schwartz-class fields using Mathlib's actual Schwartz Fourier equivalence. Extension to arbitrary L² states via Plancherel remains open."
    declarations: [ReyesMath.zero_ae_of_null_support, ReyesMath.oneDimensional_shell_ae_zero, ReyesMath.euclidean_frequency_shell_measure_zero, ReyesMath.euclidean_frequency_shell_ae_zero, ReyesMath.schwartz_fourier_shell_no_bound_state]
  F11:
    main_theorem_formalized: false
    covered: "E13/E14 band-pass gradient-flow identity and E62 Fourier energy fraction proved analytically; neither main result is Lean-formalized."
    declarations: []
  F12:
    main_theorem_formalized: false
    covered: "E26 historical additive-denominator conditional L2 estimate and counterexample proved analytically; no Lean encoding. The corrected M2/E17 regularization is a separate operator."
    declarations: []
