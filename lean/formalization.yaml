    covered: "Theorem E69 for every n in N (in particular every n >= 1), every eps > 0, every real alpha and every real s > n/2 + 2, over H^s(R^n; C) = {u in L^2 : int (1+|xi|^2)^s |u^(xi)|^2 dxi < inf} with the unitary Fourier transform u^ = Sobolev.FU u (a normed subspace of L^2 for every real s: triangle inequality, homogeneity, definiteness, Plancherel at s = 0, monotone in s, Schwartz functions in every H^s): Theta_eps[psi] = -(Delta psi) R_eps(psi), R_eps(z) = conj z/(|z|^2 + eps^2 e^(-2 alpha |z|^2)), is in L^inf (essential supremum) with ||Theta_eps[psi]||_inf <= C_(n,s) M_(eps,alpha) ||psi||_(H^s), where M = max{1, e^(2 max(alpha,0))/eps^2} and C_(n,s) = (2 pi)^(-n/2) (int (1+|xi|^2)^(-(s-2)) dxi)^(1/2) is finite, positive and independent of psi, eps and alpha. Proved on the way: the denominator is positive on C (also at z = 0), R_eps(0) = 0, the regimes |z| <= 1 and |z| >= 1, sup |R_eps| <= M; Delta = F^(-1)(-|xi|^2 F) on H^2 equals the classical Laplacian on Schwartz functions and is the unique weak Laplacian (E26.IsWeakLaplacian against real C_c^inf); ||Delta psi||_(H^(s-2)) <= ||psi||_(H^s); Fourier inversion u(x) = (2 pi)^(-n/2) int u^(xi) e^(i x.xi) dxi a.e. when u^ in L^1; the embedding H^r -> L^inf for r > n/2 by Cauchy-Schwarz and Fourier inversion, with a bounded continuous representative. Remarks: the thresholds 5/2, 3, 7/2, 4, 9/2; H^2 -> L^inf for n <= 3; for every 1 <= n <= 3 an H^2 field, bounded, with Delta psi and Theta_eps[psi] not in L^inf for every eps > 0 and alpha (H^2 regularity alone does not yield Theorem E69); on any measure space an available L^inf bound for Delta psi gives the bound for Theta (constant depending on the domain), and on the flat torus T_L^d (every d >= 1, real s > d/2 + 2) Theorem E69 with the periodic embedding; the Schwartz field q = (|x|^2 - 1) b has ||Theta_eps[q]||_inf >= n/(eps(1 + e^(2|alpha|))), so no estimate is uniform in eps in (0, 1); the older denominator z + eps e^(-alpha|z|^2) vanishes (z = -eps at alpha = 0, and some z = -t, 0 < t <= eps, for every alpha >= 0) and its reciprocal is unbounded."
