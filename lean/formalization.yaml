    verified_heavy_block: MathProofs/V18HeavyJacobian.lean
    verified_three_block_factorization: MathProofs/V18BlockJacobian.lean
    source_middle_derivatives: MathProofs/V18MiddleDerivatives.lean
    complete_frozen_forward_model: MathProofs/V18FullForward.lean
    exact_middle_block_source: MathProofs/V18MiddleJacobian.lean
    remaining: "Lean certification of the concrete trigonometric 5x5 middle determinant and the full clipped 31-parameter forward map derivative. No rank-11 full-model theorem may be claimed until both are proved."
    matrix_nullity_core_formalized: true
    exact_nullity_surjectivity_corollary: MathProofs/ExactSensitivityNullity.lean
    analytic_rank_certificate: docs/SM_V18_ANALYTIC_RANK_CERTIFICATE.md
    analytic_rank_ci: .github/workflows/v18-rank.yml
    covered: "Lean proves nullity >= 20 for every differentiable 31-to-11 map. Separately, a source-pinned model-specific interval-arithmetic certificate proves a nonzero analytic 11x11 Jacobian minor, exact rank 11 and nullity 20 on the frozen v18 active branch. A model-independent exact-nullity-20 corollary under an assumed surjective derivative is additionally proved in ExactSensitivityNullity.lean. The source-matched real-valued 31-parameter forward observation map, including clipping and branches, and five direct middle parameter-coordinate derivative lemmas are now encoded and F09 targeted-CI checked in V18FullForward.lean. The full active-sector Fréchet derivative identification and concrete nonzero 5x5 transcendental determinant have not been kernel-proved."
    declarations: [ReyesMath.elevenByThirtyone_nullity_bound, ReyesMath.nullityBound_arithmetic, ReyesMath.elevenByThirtyOne_matrix_nullity, ReyesMath.rectangular_sensitivity_nullity, ReyesMath.differential_local_identifiability_obstruction]
  F10:
    main_theorem_formalized: true
    modules: [MathProofs/FourierSupport.lean, MathProofs/SphereNull.lean, MathProofs/FourierShellL2.lean]
    covered: "Theorem (zero L^2 state on an isolated Fourier shell) on L^2(R^d), d >= 1, every k_0: for the unitary Fourier transform hat u(xi) = (2 pi)^(-d/2) int u(x) e^(-i x.xi) dx on L^1 cap L^2, extended to L^2 by Plancherel (constructed as the unitary extension of the Schwartz-space transform and identified with the Fourier integral on L^1 cap L^2), supp hat u in the shell |xi| = k_0 implies u = 0, with the support hypothesis read either as essential support or as distributional support. Corollary (free-space Helmholtz equation) for distributional solutions tested against smooth compactly supported functions (via a cutoff approximation of Schwartz functions in the graph norm of the Laplacian); Corollary (nonconstant polynomial dispersion P(-Delta) u = lambda u in S'); the general-multiplier remark; Proposition (fixed carrier, freely varying envelope: mass, Fourier transform, support and width of the modulated packets, and the radial bandwidth bound). The Schwartz-class and supplied-isometry versions (SchwartzShell.lean, L2FourierShellBridge.lean) are retained."
    declarations: [ReyesMath.FourierShell.plancherel, ReyesMath.FourierShell.shell_theorem, ReyesMath.FourierShell.shell_theorem_distrib, ReyesMath.FourierShell.helmholtz, ReyesMath.FourierShell.poly_dispersion, ReyesMath.FourierShell.multiplier, ReyesMath.FourierShell.packets, ReyesMath.Sobolev.fourierL2, ReyesMath.Sobolev.fourierL2_toL2, ReyesMath.Sobolev.fourierL2_ae_eq_fourier, ReyesMath.Sobolev.integral_mul_fourierL2, ReyesMath.Sobolev.FU, ReyesMath.Sobolev.FU_ae_eq, ReyesMath.Sobolev.fourierU, ReyesMath.Sobolev.exists_cutoff_seq, ReyesMath.Sobolev.polyLapS, ReyesMath.Sobolev.fS_polyLapS, ReyesMath.Sobolev.polyZero_null, ReyesMath.Sobolev.packet, ReyesMath.zero_ae_of_null_support, ReyesMath.euclidean_frequency_shell_measure_zero, ReyesMath.euclidean_frequency_shell_ae_zero, ReyesMath.schwartz_fourier_shell_no_bound_state, ReyesMath.l2_fourier_shell_no_bound_state_of_isometry]
  F11:
    main_theorem_formalized: false
    covered: "E13/E14 band-pass gradient-flow identity and E62 Fourier energy fraction proved analytically; neither main result is Lean-formalized."
    declarations: []
  F12:
    main_theorem_formalized: false
    covered: "E26 historical additive-denominator conditional L2 estimate and counterexample proved analytically; no Lean encoding. The corrected M2/E17 regularization is a separate operator."
    declarations: []

