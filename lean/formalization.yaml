schema_version: 3
source: rickyjreyes/math
lean_release: v4.23.0
mathlib_release: v4.23.0
scope: >
  Each family lists its manuscripts. A manuscript's main_theorem_formalized flag is true only
  when every theorem, proposition and corollary stated in that manuscript is a precise exported
  Lean declaration (no sorry/admit/axiom, no unproved hypotheses, no finite surrogate). A family
  flag is true only when all of its manuscripts are. Infinite-dimensional statements on Sobolev
  spaces use the H^2(R^d; C) construction of MathProofs/SobolevH2.lean (closure of
  {(phi, grad phi, Laplacian phi) : phi Schwartz} in L^2 x (L^2)^d x L^2).
proof_policy:
  build: "cd lean && lake update && lake exe cache get && lake build"
  excluded: ["sorry", "admit", "axiom", "native_decide"]
  note: "Passing CI certifies only the precise statements in the imported Lean source."
verification_counts:
  imported_project_modules: 86
  source_theorem_lemma_declarations: 1673
  completed_original_manuscripts: 13
  original_manuscripts: 14
  note: "Declaration inventory includes private source lemmas; it is not a count of distinct mathematical results."
families:
  F01:
    main_theorem_formalized: true
    status: MAIN_THEOREM_VERIFIED
    manuscripts:
      strict-subadditivity-fourth-order-cubic-quintic:
        main_theorem_formalized: true
        modules: [MathProofs/SobolevH2.lean, MathProofs/NegativeEnergy.lean, MathProofs/StrictBinding.lean]
        covered: "Theorem (explicit strict-binding range) for beta, gamma > 0, every k, 0 < m <= m_B, 0 < mu < m, on H^2(R^2; C) without any attainment assumption; Proposition (quantitative energy-per-mass gap); all lemmas (coercive lower bound and H^2 boundedness, negativity, dilation-stationary minimizing sequences, exact stationary square-completion identity, Fourier sup-norm estimate, stationary sextic/quartic ratio); Corollary (exact frozen binary64 parameters)."
        declarations: [ReyesMath.StrictBinding.strict_binding, ReyesMath.StrictBinding.gap, ReyesMath.StrictBinding.frozen_parameters, ReyesMath.StrictBinding.exists_stationary_minimizing_seq, ReyesMath.StrictBinding.bounded_of_energy_le, ReyesMath.Sobolev.H2.stationary_square, ReyesMath.Sobolev.H2.S_le_of_stationary, ReyesMath.Sobolev.H2.ae_sup_bound_opt, ReyesMath.Sobolev.H2.energy_ge]
      negative-constrained-energy-cubic-quintic:
        main_theorem_formalized: true
        modules: [MathProofs/SobolevH2.lean, MathProofs/NegativeEnergy.lean]
        covered: "-(3 beta^2/(16 gamma)) m <= I(m) < 0 for every m > 0 on H^2(R^2; C). The negative trial is an anisotropic plane-wave carrier built on a smooth compactly supported bump in place of the Gaussian (same two-term R-scaling c2/R^2 + c4/R^4 with c2 < 0 for large anisotropy)."
        declarations: [ReyesMath.NegativeEnergy.negative_constrained_energy, ReyesMath.NegativeEnergy.exists_negative, ReyesMath.Sobolev.H2.energy_ge]
      whole-space-fourth-order-cubic-quintic-minimizers:
        main_theorem_formalized: true
        supporting_lemma: MathProofs/MinimizerNonvanishing.lean
        modules: [MathProofs/SobolevH2.lean, MathProofs/NegativeEnergy.lean, MathProofs/StrictBinding.lean, MathProofs/WholeSpaceMinimizers.lean]
        covered: "Theorem (whole-space existence and compactness) for beta, gamma > 0, every k and 0 < m <= m_B on H^2(R^2; C): (i) bounds on I(m); (ii) strict binding at every split; (iii) every minimizing sequence has a subsequence that converges strongly in H^2 after spatial translations to some u with M(u) = m and H(u) = I(m); hence G_m is nonempty and sequentially compact modulo translations. Proved with translations on H^2, a Fourier Holder-1/2 estimate and its disc-average form (no-vanishing lemma), weak sequential compactness in separable Hilbert spaces, weak closedness of H^2, a.e. convergence of weakly null bounded sequences, the Brezis-Lieb lemma, the Hilbert splittings of M and T, and mass correction plus strict binding."
        declarations: [ReyesMath.WholeSpace.main, ReyesMath.WholeSpace.compactness, ReyesMath.WholeSpace.exists_minimizer, ReyesMath.WholeSpace.minimizers_seq_compact, ReyesMath.WholeSpace.conclusion, ReyesMath.WholeSpace.exists_translations, ReyesMath.WholeSpace.exists_profile, ReyesMath.Sobolev.H2.exists_ball_avg, ReyesMath.Sobolev.holder_schwartz, ReyesMath.Sobolev.H2.ae_ball_avg, ReyesMath.WeakCompact.exists_weak_subseq, ReyesMath.Sobolev.H2.exists_weak_limit, ReyesMath.Sobolev.H2.ae_tendsto_zero_of_weak, ReyesMath.BrezisLieb.brezis_lieb, ReyesMath.Sobolev.H2.tendsto_energy_split, ReyesMath.Sobolev.H2.exists_energy_ge_Imin, ReyesMath.Sobolev.H2.energy_translate, ReyesMath.NegativeEnergy.negative_constrained_energy, ReyesMath.StrictBinding.strict_binding]
      orbital-stability-fourth-order-cubic-quintic:
        main_theorem_formalized: true
        modules: [MathProofs/SobolevH2.lean, MathProofs/NegativeEnergy.lean, MathProofs/StrictBinding.lean, MathProofs/WholeSpaceMinimizers.lean, MathProofs/FreeEvolution.lean, MathProofs/H2Algebra.lean, MathProofs/CubicQuinticFlow.lean, MathProofs/OrbitalStability.lean]
        covered: "Theorem (existence, compactness and full-set orbital stability) for beta, gamma > 0, every k and 0 < m <= m_B on H^2(R^2; C): (i) -(3 beta^2/(16 gamma)) m <= I(m) < 0 and I(m) < I(a) + I(m - a) for 0 < a < m; (ii) G_m is nonempty and every mass-m minimizing sequence has a subsequence converging strongly in H^2 after spatial translations to an element of G_m; (iii) every datum in H^2 generates a unique global solution u in C(R; H^2) of i u_t = (Laplacian + k^2)^2 u - beta |u|^2 u + gamma |u|^4 u, and every solution conserves M and H (a solution is continuous into H^2 and satisfies the equation in the sense of distributions against every Schwartz test function); (iv) for every eps > 0 there is delta > 0 such that dist_X(u_0, G_m) < delta implies sup_t dist_X(u(t), G_m) < eps, for data of any mass. Proposition (global well-posedness and conservation), including continuous dependence on the data uniformly on bounded time intervals; Lemma (coercivity at fixed mass). Proved with the free group e^{-it(Laplacian + k^2)^2} on Schwartz space, L^2 and H^2 (Fourier multiplier, unitary extension, weak generator), the H^2(R^2) algebra estimate and the local Lipschitz bound of the cubic-quintic nonlinearity, the interaction-picture Picard-Lindelof construction with a radial truncation, conservation of mass and energy along the flow, uniqueness and a Gronwall estimate, and the Cazenave-Lions argument with mass normalization. Strict negativity, the energy-per-mass lemmas, strict binding and compactness modulo translations are the declarations of the negative-energy, strict-subadditivity and whole-space-minimizer entries. dist_X is computed with the H^2 distance distH2 (the sum of the L^2 norms of the differences of u, its gradient and its Laplacian), which is equivalent to the H^2 norm."
        declarations: [ReyesMath.OrbitalStability.main, ReyesMath.OrbitalStability.orbital_stability, ReyesMath.OrbitalStability.stable_core, ReyesMath.OrbitalStability.global_flow, ReyesMath.OrbitalStability.coercivity, ReyesMath.OrbitalStability.bounded_of_mass_energy, ReyesMath.OrbitalStability.Gset, ReyesMath.OrbitalStability.distX, ReyesMath.Sobolev.IsSolution, ReyesMath.Sobolev.global_wellposed, ReyesMath.Sobolev.continuous_dependence, ReyesMath.Sobolev.conservation, ReyesMath.Sobolev.isSolution_of_ode, ReyesMath.Sobolev.ode_of_isSolution, ReyesMath.Sobolev.exists_global, ReyesMath.Sobolev.exists_global_tr, ReyesMath.Sobolev.ode_unique, ReyesMath.Sobolev.ode_dist_le, ReyesMath.Sobolev.hasDerivAt_mass, ReyesMath.Sobolev.hasDerivAt_Esp, ReyesMath.Sobolev.hasDerivAt_inner_Usp, ReyesMath.Sobolev.norm_toSp_sq_le, ReyesMath.Sobolev.Usp, ReyesMath.Sobolev.U2, ReyesMath.Sobolev.US, ReyesMath.Sobolev.tendsto_Qh, ReyesMath.Sobolev.norm_ιS_mulS_le, ReyesMath.Sobolev.Fnl, ReyesMath.Sobolev.vl_Fnl_ae, ReyesMath.Sobolev.norm_Fnl_sub_le, ReyesMath.Sobolev.Nsp_taylor, ReyesMath.WholeSpace.compactness, ReyesMath.WholeSpace.exists_minimizer, ReyesMath.StrictBinding.strict_binding, ReyesMath.StrictBinding.gap, ReyesMath.NegativeEnergy.negative_constrained_energy]
    legacy_supporting_declarations: [ReyesMath.negativeEnergy_strictGap]
