        covered: "Theorem E26 for every open Omega in a finite-dimensional real inner product space (R^d = EuclideanSpace R (Fin d), Lebesgue measure; every d, no boundary condition), all real epsilon, alpha: H^2(Omega; C) is defined by weak derivatives (psi in L^2(Omega) and, for every order k <= 2 and all directions, a weak derivative in L^2(Omega) against C_c^infty(Omega) test functions); Delta psi is the weak Laplacian (tested against Mathlib's Laplacian), which exists in L^2(Omega) for psi in H^2 and is unique a.e. (fundamental lemma of the calculus of variations). If ess inf |D_epsilon[psi]| >= delta > 0 with D_epsilon[psi] = psi + epsilon e^(-alpha|psi|^2), then Delta psi in L^2, D_epsilon[psi] != 0 a.e., ||1/D_epsilon[psi]||_inf <= 1/delta, Theta_epsilon[psi] = -Delta psi/D_epsilon[psi] is in L^2(Omega) and ||Theta_epsilon[psi]||_L2 <= delta^(-1) ||Delta psi||_L2 (also squared-integral form). Corollary (|psi| >= m > epsilon a.e., epsilon > 0, alpha >= 0: bound with (m - epsilon)^(-1)); the remark that no L^2 function on all of R^d (d >= 1) satisfies |psi| >= m > 0 a.e.; Corollary (real psi >= 0 a.e.: bound with delta_epsilon = min(epsilon/2, epsilon e^(-alpha epsilon^2/4)) > 0); Counterexample on (-1,1) with alpha = 0 and psi = x^2 - epsilon in H^2: D = x^2, Delta psi = 2, Theta = -2/x^2, int |Theta|^2 = +infinity (Theta not in L^2) while ||Delta psi||^2 = 8, so no finite constant works and the denominator hypothesis fails for every delta > 0; the corrected phase-covariant multiplier R_epsilon(z) = conj z/(|z|^2 + epsilon^2 e^(-2 alpha |z|^2)) of M2/E17 satisfies |R| <= 1/|z| <= 2/epsilon for |z| >= epsilon/2 and |R| <= |z| e^(2 alpha |z|^2)/epsilon^2 <= e^(alpha epsilon^2/2)/(2 epsilon) otherwise, hence the unconditional bound ||(Delta psi) R_epsilon(psi)||_L2 <= epsilon^(-1) max(2, e^(alpha epsilon^2/2)/2) ||Delta psi||_L2 on H^2; and the scope statement that delta cannot be replaced by epsilon (an explicit H^2 field on (-1,1) satisfying the hypothesis with ||Theta|| > epsilon^(-1) ||Delta psi||). The quotient on its a.e. nonzero-denominator domain: under the denominator bound, {D_epsilon[psi] != 0} is null-measurable with null complement in Omega, Theta D = -Delta psi on it, and Theta is the a.e.-unique solution there, so the value at zeros of D (Lean's z/0 = 0) is immaterial. Wrappers for open Omega in R^d (E26Certification) restate the theorem, both corollaries, the counterexample and the scope statement. Beyond the manuscript, the constant 1/delta is sharp: for every K < 1 a smooth field in H^2((-1,1)) satisfies |D_epsilon[psi]| >= delta everywhere and ||Theta|| > (K/delta)||Delta psi||. The corrected M2/E17 regularization is a separate operator (open_manuscripts.regularized-curvature-operator)."
