schema_version: 3
source: rickyjreyes/math
lean_release: v4.23.0
mathlib_release: v4.23.0
scope: >
  Each family lists its manuscripts. A manuscript's main_theorem_formalized flag is true only
  when every theorem, proposition and corollary stated in that manuscript is a precise exported
  Lean declaration (no sorry/admit/axiom, no unproved hypotheses, no finite surrogate). A family
  flag is true only when all of its manuscripts are. Infinite-dimensional statements on Sobolev
  spaces use the H^2(R^d; C) construction of MathProofs/SobolevH2.lean (closure of
  {(phi, grad phi, Laplacian phi) : phi Schwartz} in L^2 x (L^2)^d x L^2).
proof_policy:
  build: "cd lean && lake update && lake exe cache get && lake build"
  excluded: ["sorry", "admit", "axiom"]
  note: "Passing CI certifies only the precise statements in the imported Lean source."
families:
  F01:
    main_theorem_formalized: false
    manuscripts:
      strict-subadditivity-fourth-order-cubic-quintic:
        main_theorem_formalized: true
        modules: [MathProofs/SobolevH2.lean, MathProofs/NegativeEnergy.lean, MathProofs/StrictBinding.lean]
        covered: "Theorem (explicit strict-binding range) for beta, gamma > 0, every k, 0 < m <= m_B, 0 < mu < m, on H^2(R^2; C) without any attainment assumption; Proposition (quantitative energy-per-mass gap); all lemmas (coercive lower bound and H^2 boundedness, negativity, dilation-stationary minimizing sequences, exact stationary square-completion identity, Fourier sup-norm estimate, stationary sextic/quartic ratio); Corollary (exact frozen binary64 parameters)."
        declarations: [ReyesMath.StrictBinding.strict_binding, ReyesMath.StrictBinding.gap, ReyesMath.StrictBinding.frozen_parameters, ReyesMath.StrictBinding.exists_stationary_minimizing_seq, ReyesMath.StrictBinding.bounded_of_energy_le, ReyesMath.Sobolev.H2.stationary_square, ReyesMath.Sobolev.H2.S_le_of_stationary, ReyesMath.Sobolev.H2.ae_sup_bound_opt, ReyesMath.Sobolev.H2.energy_ge]
      negative-constrained-energy-cubic-quintic:
        main_theorem_formalized: true
        modules: [MathProofs/SobolevH2.lean, MathProofs/NegativeEnergy.lean]
        covered: "-(3 beta^2/(16 gamma)) m <= I(m) < 0 for every m > 0 on H^2(R^2; C). The negative trial is an anisotropic plane-wave carrier built on a smooth compactly supported bump in place of the Gaussian (same two-term R-scaling c2/R^2 + c4/R^4 with c2 < 0 for large anisotropy)."
        declarations: [ReyesMath.NegativeEnergy.negative_constrained_energy, ReyesMath.NegativeEnergy.exists_negative, ReyesMath.Sobolev.H2.energy_ge]
      whole-space-fourth-order-cubic-quintic-minimizers:
        main_theorem_formalized: true
        modules: [MathProofs/SobolevH2.lean, MathProofs/NegativeEnergy.lean, MathProofs/StrictBinding.lean, MathProofs/WholeSpaceMinimizers.lean]
        covered: "Theorem (whole-space existence and compactness) for beta, gamma > 0, every k and 0 < m <= m_B on H^2(R^2; C): (i) bounds on I(m); (ii) strict binding at every split; (iii) every minimizing sequence has a subsequence that converges strongly in H^2 after spatial translations to some u with M(u) = m and H(u) = I(m); hence G_m is nonempty and sequentially compact modulo translations. Proved with translations on H^2, a Fourier Holder-1/2 estimate and its disc-average form (no-vanishing lemma), weak sequential compactness in separable Hilbert spaces, weak closedness of H^2, a.e. convergence of weakly null bounded sequences, the Brezis-Lieb lemma, the Hilbert splittings of M and T, and mass correction plus strict binding."
        declarations: [ReyesMath.WholeSpace.main, ReyesMath.WholeSpace.compactness, ReyesMath.WholeSpace.exists_minimizer, ReyesMath.WholeSpace.minimizers_seq_compact, ReyesMath.WholeSpace.conclusion, ReyesMath.WholeSpace.exists_translations, ReyesMath.WholeSpace.exists_profile, ReyesMath.Sobolev.H2.exists_ball_avg, ReyesMath.Sobolev.holder_schwartz, ReyesMath.Sobolev.H2.ae_ball_avg, ReyesMath.WeakCompact.exists_weak_subseq, ReyesMath.Sobolev.H2.exists_weak_limit, ReyesMath.Sobolev.H2.ae_tendsto_zero_of_weak, ReyesMath.BrezisLieb.brezis_lieb, ReyesMath.Sobolev.H2.tendsto_energy_split, ReyesMath.Sobolev.H2.exists_energy_ge_Imin, ReyesMath.Sobolev.H2.energy_translate, ReyesMath.NegativeEnergy.negative_constrained_energy, ReyesMath.StrictBinding.strict_binding]
      orbital-stability-fourth-order-cubic-quintic:
        main_theorem_formalized: false
        gaps: "Global H^2 well-posedness, conservation laws, compactness of minimizing sequences and orbital stability are not formalized."
        declarations: []
    legacy_supporting_declarations: [ReyesMath.negativeEnergy_strictGap]
  F02:
    main_theorem_formalized: true
    manuscripts:
      uv-sobolev-ill-posedness-fourth-order-wave:
        main_theorem_formalized: true
        modules: [MathProofs/UVIllPosedness.lean, MathProofs/UVWholeSpace.lean]
        covered: "Exact growing temporal root and characteristic equation; ultraviolet growth asymptotics and comparability; exact smooth solutions on the flat torus and Fourier-packet smooth solutions on R^d; four-jet Sobolev norms with isometric Hilbert realizations; Theorem 1 and the general-sector Proposition (no bounded estimate, operator or linear extension X_{r+l} -> X_r) on both T^d and R^d, including the stated equation box u - box^2 u - Delta^2 u = 0."
        declarations: [ReyesMath.UVIllPosed.dispersion_root, ReyesMath.UVIllPosed.sigma_pos, ReyesMath.UVIllPosed.torus_unbounded, ReyesMath.UVIllPosed.torus_no_bounded_operator, ReyesMath.UVIllPosed.wave_torus_unbounded, ReyesMath.UVIllPosed.whole_unbounded, ReyesMath.UVIllPosed.whole_no_bounded_operator, ReyesMath.UVIllPosed.wave_whole_unbounded]
      s004-complex-scalar-constraint-count:
        main_theorem_formalized: true
        modules: [MathProofs/S004ConstraintCount.lean]
        covered: "Lemmas 1-2 and the theorem: acceleration Hessian from the actual second Frechet derivative, canonical momenta and Legendre image (four primary constraints), Dirac matrix of determinant one (no first-class constraint), no secondary constraints, eight-dimensional reduced phase space and N_conf = 4; unbounded canonical energy; U(1) charge."
        declarations: [ReyesMath.S004.accHessian_det_pos, ReyesMath.S004.legendre_image, ReyesMath.S004.diracMatrix_det, ReyesMath.S004.no_first_class, ReyesMath.S004.no_secondary_constraints, ReyesMath.S004.constraint_count, ReyesMath.S004.Hphys_unbounded_below, ReyesMath.S004.charge_not_constraint]
    legacy_supporting_declarations: [ReyesMath.s004_acceleration_hessian_det, ReyesMath.s004_acceleration_hessian_det_pos, ReyesMath.ultraviolet_plus_root_exact, ReyesMath.ultraviolet_minus_root_exact]
  F03:
    main_theorem_formalized: true
    manuscripts:
      spectral-rms-averaged-curvature:
        main_theorem_formalized: true
        modules: [MathProofs/SpectralPhaseIdentity.lean]
        covered: "Exact continuous identity lambda - <sigma>^2 = int |R'|^2 / int R^2 + Var_w(sigma) for C^2 periodic nowhere-vanishing eigenmodes with polar form (whose existence is proved), equality case, spectral-root form, the 4/5 counterexample with gap accounting, and the closed unit-speed planar curve with <kappa> = 4/5."
        declarations: [ReyesMath.SpectralPhase.sharp_spectral_phase_decomposition, ReyesMath.SpectralPhase.root_identity, ReyesMath.SpectralPhase.exists_polar_lift, ReyesMath.SpectralPhase.four_fifths, ReyesMath.SpectralPhase.gap_accounting, ReyesMath.SpectralPhase.geometric_lock_four_fifths]
    legacy_supporting_declarations: [ReyesMath.varianceDeficit_nonnegative, ReyesMath.finite_weighted_variance_identity, ReyesMath.finite_weighted_mean_square_bound]
  F04:
    main_theorem_formalized: true
    manuscripts:
      finite-fourier-coordinate-subspace-noninvariance:
        main_theorem_formalized: true
        modules: [MathProofs/FourierLeakage.lean, MathProofs/FourierLeakageWellPosed.lean]
        covered: "Classical solutions of i u_t = (Laplacian + kappa^2)^2 u - beta |u|^2 u + gamma |u|^4 u on the flat torus: uniqueness (L^2 energy method with a periodic Green identity) and local existence for every trigonometric polynomial datum (interaction-picture Picard-Lindelof in a weighted Wiener algebra); Theorem 1 (no E_S with |S| >= 2 is invariant, with the leaking frequency r = 3p - 2q and d/dt u^(r,0) != 0), Theorem 2 (universal leakage for every multimode datum), the classification corollary (E_S invariant iff |S| <= 1), and the fifth-harmonic proposition."
        declarations: [ReyesMath.FourierLeakage.classification, ReyesMath.FourierLeakage.noninvariance, ReyesMath.FourierLeakage.universal_leakage_solution, ReyesMath.FourierLeakage.fifth_harmonic_solution, ReyesMath.FourierLeakage.exists_classical_solution, ReyesMath.FourierLeakage.IsClassicalSolution.unique, ReyesMath.FourierLeakage.universal_leakage, ReyesMath.FourierLeakage.no_multimode_invariance, ReyesMath.FourierLeakage.fifth_harmonic, ReyesMath.FourierLeakage.coeff_quintic_leak]
    legacy_supporting_declarations: [ReyesMath.quintic_frequency_above_cutoff, ReyesMath.quintic_frequency_below_cutoff, ReyesMath.multidimensional_quintic_frequency_escape]
  F05:
    main_theorem_formalized: true
    manuscripts:
      positive-curvature-whole-space-nonattainment:
        main_theorem_formalized: true
        modules: [MathProofs/SobolevH2.lean, MathProofs/CurvatureNonattainment.lean]
        covered: "Theorem 1 for every d >= 1 and m > 0 on H^2(R^d; C): E finite (integrable curvature integrand) and nonnegative, positive at every nonzero psi, I_d(m) = 0 and empty set of constrained minimizers. Theorem 2 for 1 <= d <= 4: lambda -> E(psi_lambda) is C^1 and strictly increasing on (0, infinity), with the derivative formula and the log-derivative bound, E(psi_lambda) < E(psi) for 0 < lambda < 1, strong continuity of the dilation group on H^2, and no local constrained minimizer in the H^2 topology."
        declarations: [ReyesMath.Curvature.global_nonattainment, ReyesMath.Curvature.strict_spreading, ReyesMath.Curvature.no_local_minimizer, ReyesMath.Curvature.hasDerivAt_eDil, ReyesMath.Curvature.log_deriv_ge, ReyesMath.Curvature.virial_weight, ReyesMath.Curvature.Ec_eq_zero_iff, ReyesMath.Sobolev.H2.val_eq_zero_of_K_eq_zero, ReyesMath.Sobolev.H2.tendsto_distH2_dilR]
  F06:
    main_theorem_formalized: true
    manuscripts:
      exact-positive-wavenumber-minimum:
        main_theorem_formalized: true
        modules: [MathProofs/DispersionMinimum.lean]
        covered: "Main theorem under the manuscript hypotheses (real branches, collision wavenumber, explicit q*, unique global minimizer, second derivative), both corollaries and the wavenumber remark."
        declarations: [ReyesMath.Dispersion.exact_positive_wavenumber_minimum, ReyesMath.Dispersion.exact_minimum_frequency, ReyesMath.Dispersion.sharp_initial_slope_criterion, ReyesMath.Dispersion.min_at_zero_of_not_finiteScale, ReyesMath.Dispersion.omegaMinus_unique_min, ReyesMath.Dispersion.wavenumber_minimum, ReyesMath.Dispersion.wavenumber_second_deriv]
    legacy_supporting_declarations: [ReyesMath.dispersion_discriminant_identity, ReyesMath.dispersion_tangent_square_identity, ReyesMath.dispersion_unique_minimum_at_stationary]
  F07:
    main_theorem_formalized: true
    manuscripts:
      weighted-closed-loop-phase-locking:
        main_theorem_formalized: true
        modules: [MathProofs/PhaseLockingContinuous.lean]
        covered: "Main theorem for H^1 phases with measurable weights bounded above and below (minimum Delta_n^2/I, explicit minimizer, exact remainder, uniqueness), both corollaries, the sector proposition and the uniform-weight example."
        declarations: [ReyesMath.phase_locking_exact_minimum, ReyesMath.exact_lock_criterion, ReyesMath.optimalPhase_perturbation, ReyesMath.optimalPhase_second_variation, ReyesMath.perturbation_weight_eq_zero_iff, ReyesMath.sector_selection, ReyesMath.nearest_integers_unique, ReyesMath.nearest_integers_tie, ReyesMath.uniform_weight_example]
    legacy_supporting_declarations: [ReyesMath.squaredMismatch_nonnegative, ReyesMath.finite_weighted_phase_bound, ReyesMath.finite_weighted_phase_remainder, ReyesMath.finite_weighted_phase_exact_gap, ReyesMath.finite_weighted_phase_sharp_bound]
  F08:
    main_theorem_formalized: false
    algebraic_no_go_core_formalized: true
    covered: "Actual differentiable complex field on Euclidean 4-charts and arbitrary four-chart spaces: tensor equals Gram matrix, rank ≤2, and exact matrix contraction is nonnegative. Arbitrary nonnegative weighted carriers also covered. Coordinate-independent global tensor bundle construction and smooth chart-transition covariance are not formalized."
    declarations: [ReyesMath.scalarGradientGram_nonnegative, ReyesMath.scalarGradientGram_psd, ReyesMath.scalarGradientGram_no_timelike, ReyesMath.scalarGradientCarrier_gram_entry, ReyesMath.scalarGradientCarrier_rank_le_two, ReyesMath.positive_weighted_gradient_family_psd, ReyesMath.gradient_gram_rank_le_carriers, ReyesMath.complex_gradient_real_identity, ReyesMath.complex_gradient_tensor_eq_gram, ReyesMath.complex_gradient_tensor_rank_le_two, ReyesMath.complex_field_metric_is_gram, ReyesMath.complex_field_metric_rank_le_two, ReyesMath.complex_field_metric_quadratic_nonnegative, ReyesMath.complex_field_metric_no_timelike, ReyesMath.charted_complex_metric_rank_le_two, ReyesMath.charted_complex_metric_no_timelike, ReyesMath.charted_complex_metric_everywhere_obstruction, ReyesMath.charted_complex_metric_matrix_psd, ReyesMath.charted_complex_metric_full_pointwise_obstruction, ReyesMath.gradient_gram_matrix_quadratic, ReyesMath.complex_field_matrix_psd, ReyesMath.complex_field_matrix_no_timelike]
  F09:
    main_theorem_formalized: false
    matrix_nullity_core_formalized: true
    covered: "Any real 11-by-31 matrix has at least 20 kernel dimensions; extended to the Fréchet derivative of any differentiable 31-to-11 map. Model-specific Jacobian and measured numerical rank 11 remain outside Lean."
    declarations: [ReyesMath.elevenByThirtyone_nullity_bound, ReyesMath.nullityBound_arithmetic, ReyesMath.elevenByThirtyOne_matrix_nullity, ReyesMath.rectangular_sensitivity_nullity, ReyesMath.differential_local_identifiability_obstruction]
  F10:
    main_theorem_formalized: false
    covered: "Arbitrary-dimensional null Fourier sphere and vanishing a.e. Fourier representative. A full Fourier inversion/nonlocalization proof is now formalized for Schwartz-class fields using Mathlib's actual Schwartz Fourier equivalence. Extension to arbitrary L² states via Plancherel remains open."
    declarations: [ReyesMath.zero_ae_of_null_support, ReyesMath.oneDimensional_shell_ae_zero, ReyesMath.euclidean_frequency_shell_measure_zero, ReyesMath.euclidean_frequency_shell_ae_zero, ReyesMath.schwartz_fourier_shell_no_bound_state]
  F11:
    main_theorem_formalized: false
    covered: "E13/E14 band-pass gradient-flow identity and E62 Fourier energy fraction proved analytically; neither main result is Lean-formalized."
    declarations: []
  F12:
    main_theorem_formalized: false
    covered: "E26 historical additive-denominator conditional L2 estimate and counterexample proved analytically; no Lean encoding. The corrected M2/E17 regularization is a separate operator."
    declarations: []
