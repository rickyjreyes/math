schema_version: 2
source: rickyjreyes/math
lean_release: v4.23.0
mathlib_release: v4.23.0
scope: >
  Local finite-dimensional, measure-theoretic, and polynomial-algebra cores are encoded
  in Lean. Continuous PDE, dynamics, Gaussian variational constructions,
  and other analytic main results are NOT thereby kernel-checked.
proof_policy:
  build: "cd lean && lake update && lake exe cache get && lake build"
  excluded: ["sorry", "admit", "axiom"]
  note: "Passing CI certifies only the precise statements in the imported Lean source."
families:
  F01:
    main_theorem_formalized: false
    covered: "Only algebraic strict-gap lemma; no PDE binding, attainment, or stability."
    declarations: [ReyesMath.negativeEnergy_strictGap]
  F02:
    main_theorem_formalized: false
    covered: "Acceleration Hessian determinant/positivity and both exact complex UV characteristic roots are formalized; four-jet ill-posedness, high-frequency growth, and Dirac/Ostrogradsky constraint count are not."
    declarations: [ReyesMath.s004_acceleration_hessian_det, ReyesMath.s004_acceleration_hessian_det_pos, ReyesMath.ultraviolet_plus_root_exact, ReyesMath.ultraviolet_minus_root_exact]
  F03:
    main_theorem_formalized: false
    covered: "Finite weighted variance identity and nonnegative variance; not the continuous periodic spectral identity."
    declarations: [ReyesMath.varianceDeficit_nonnegative, ReyesMath.finite_weighted_variance_identity, ReyesMath.finite_weighted_mean_square_bound]
  F04:
    main_theorem_formalized: false
    covered: "One-dimensional cutoff and coordinatewise multidimensional quintic escape arithmetic; not general polynomial-flow coefficients or full noninvariance theorem."
    declarations: [ReyesMath.quintic_frequency_above_cutoff, ReyesMath.quintic_frequency_below_cutoff, ReyesMath.multidimensional_quintic_frequency_escape]
  F05:
    main_theorem_formalized: false
    covered: "Curvature-energy nonattainment not formalized."
    declarations: []
  F06:
    main_theorem_formalized: false
    covered: "Exact discriminant, supporting-tangent square identity, and strict global uniqueness of a given admissible stationary minimum are formalized; original parameter hypotheses and existence/explicit critical point remain."
    declarations: [ReyesMath.dispersion_discriminant_identity, ReyesMath.dispersion_tangent_square_identity, ReyesMath.dispersion_unique_minimum_at_stationary]
  F07:
    main_theorem_formalized: false
    covered: "Finite weighted bound, exact gap/completion-of-square identity, and sharp lower bound; not the continuous closed-loop theorem or equality characterization."
    declarations: [ReyesMath.squaredMismatch_nonnegative, ReyesMath.finite_weighted_phase_bound, ReyesMath.finite_weighted_phase_remainder, ReyesMath.finite_weighted_phase_exact_gap, ReyesMath.finite_weighted_phase_sharp_bound]
  F08:
    main_theorem_formalized: false
    algebraic_no_go_core_formalized: true
    covered: "Actual differentiable complex field on Euclidean 4-charts and arbitrary four-chart spaces: tensor equals Gram matrix, rank ≤2, and exact matrix contraction is nonnegative. Arbitrary nonnegative weighted carriers also covered. Coordinate-independent global tensor bundle construction and smooth chart-transition covariance are not formalized."
    declarations: [ReyesMath.scalarGradientGram_nonnegative, ReyesMath.scalarGradientGram_psd, ReyesMath.scalarGradientGram_no_timelike, ReyesMath.scalarGradientCarrier_gram_entry, ReyesMath.scalarGradientCarrier_rank_le_two, ReyesMath.positive_weighted_gradient_family_psd, ReyesMath.gradient_gram_rank_le_carriers, ReyesMath.complex_gradient_real_identity, ReyesMath.complex_gradient_tensor_eq_gram, ReyesMath.complex_gradient_tensor_rank_le_two, ReyesMath.complex_field_metric_is_gram, ReyesMath.complex_field_metric_rank_le_two, ReyesMath.complex_field_metric_quadratic_nonnegative, ReyesMath.complex_field_metric_no_timelike, ReyesMath.charted_complex_metric_rank_le_two, ReyesMath.charted_complex_metric_no_timelike, ReyesMath.charted_complex_metric_everywhere_obstruction, ReyesMath.gradient_gram_matrix_quadratic, ReyesMath.complex_field_matrix_psd, ReyesMath.complex_field_matrix_no_timelike]
  F09:
    main_theorem_formalized: false
    matrix_nullity_core_formalized: true
    covered: "Any real 11-by-31 matrix has at least 20 kernel dimensions; extended to the Fréchet derivative of any differentiable 31-to-11 map. Model-specific Jacobian and measured numerical rank 11 remain outside Lean."
    declarations: [ReyesMath.elevenByThirtyone_nullity_bound, ReyesMath.nullityBound_arithmetic, ReyesMath.elevenByThirtyOne_matrix_nullity, ReyesMath.rectangular_sensitivity_nullity, ReyesMath.differential_local_identifiability_obstruction]
  F10:
    main_theorem_formalized: false
    covered: "Arbitrary-dimensional null Fourier sphere and vanishing a.e. Fourier representative. A full Fourier inversion/nonlocalization proof is now formalized for Schwartz-class fields using Mathlib's actual Schwartz Fourier equivalence. Extension to arbitrary L² states via Plancherel remains open."
    declarations: [ReyesMath.zero_ae_of_null_support, ReyesMath.oneDimensional_shell_ae_zero, ReyesMath.euclidean_frequency_shell_measure_zero, ReyesMath.euclidean_frequency_shell_ae_zero, ReyesMath.schwartz_fourier_shell_no_bound_state]
  F11:
    main_theorem_formalized: false
    covered: "E13/E14 band-pass gradient-flow identity and E62 Fourier energy fraction proved analytically; neither main result is Lean-formalized."
    declarations: []
  F12:
    main_theorem_formalized: false
    covered: "E26 historical additive-denominator conditional L2 estimate and counterexample proved analytically; no Lean encoding. The corrected M2/E17 regularization is a separate operator."
    declarations: []
