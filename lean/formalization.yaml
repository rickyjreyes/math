schema_version: 3
source: rickyjreyes/math
lean_release: v4.23.0
mathlib_release: v4.23.0
scope: >
  Each family lists its manuscripts. A manuscript's main_theorem_formalized flag is true only
  when every theorem, proposition and corollary stated in that manuscript is a precise exported
  Lean declaration (no sorry/admit/axiom, no unproved hypotheses, no finite surrogate). A family
  flag is true only when all of its manuscripts are. Infinite-dimensional statements on Sobolev
  spaces use the H^2(R^d; C) construction of MathProofs/SobolevH2.lean (closure of
  {(phi, grad phi, Laplacian phi) : phi Schwartz} in L^2 x (L^2)^d x L^2). E68 uses H^1 and H^2
  of R^n by weak derivatives (MathProofs/E68Sobolev.lean, MathProofs/E68H2.lean), with proved
  compatibility with SobolevH2, E26.IsWeakDeriv and WeakH1Field. E69 uses H^s(R^n; C) of every real
  order s by the unitary Fourier transform (MathProofs/E69Sobolev.lean), whose Laplacian is proved to be
  the classical Laplacian on Schwartz functions and the unique weak Laplacian, and H^s of the flat torus
  by Fourier coefficients (MathProofs/E69Torus.lean).
proof_policy:
  build: "cd lean && lake update && lake exe cache get && lake build"
  excluded: ["sorry", "admit", "axiom", "native_decide"]
  note: "Passing CI certifies only the precise statements in the imported Lean source."
verification_counts:
  imported_project_modules: 159
  source_theorem_lemma_declarations: 2945
  completed_original_manuscripts: 14
  original_manuscripts: 14
  completed_additional_family_manuscripts: 5
  additional_family_manuscripts: 5
  formalized_supplementary_manuscripts: [m6b-nonlinear-curvature-nonuniqueness, band-selective-green-kernel-bound, e61-pattern-formation-threshold, swift-hohenberg-fourier-shell-damping, regularized-curvature-operator, localized-gradient-energy-e68, high-regularity-bounded-curvature-e69]
  unformalized_supplementary_manuscripts: [wct-e18-exact-gradient-lyapunov]
  note: "Declaration inventory includes private source lemmas; it is not a count of distinct mathematical results. Counted as lines of lean/MathProofs/*.lean that begin with theorem or lemma, optionally after one attribute and private or protected (see docs/ANALYTIC_CERTIFICATION_2026-10-30.md). The additional families are F11 (E13/E14, E16, E59, E62) and F12 (E26)."
