    covered: "V18FullForward encodes the real-arithmetic source formula with all 31 coordinates, including variable middle frequencies at coordinates 10 and 11, the clipping and dispatch. It defines the actual Frechet Jacobian, proves rank <= 11, nullity = 31 - rank >= 20, and vanishing directional derivatives for its kernel vectors at differentiability points. All seven middle coordinate derivatives are proved. V18Regularity proves equality with the full-parameter smooth branches on an open neighborhood and C1 regularity of the actual map. V18Frechet identifies its full derivative throughout a neighborhood, retaining all active coefficient, frequency, exponent and suppression dependencies. V18BranchBounds proves strict light and heavy floor inequalities, the heavy inner light floor, and exponential/power clipping bounds at the frozen vector. V18MiddleFloor and V18MiddleClipped discharge the floor premise at all five frozen middle observations, for both the five selected columns and the two frequency columns. Frozen Lean constants represent the published exact decimals, not NumPy rounding semantics. Separately, the source-pinned interval certificate now encloses both the nominal decimals and exact stored binary64 inputs, verifies the strict branches, and certifies a nonzero analytic minor outside Lean. The actual middle determinant is now kernel-proved to lie strictly between 18000000 and 24000000, using exact rational interval arithmetic and Mathlib Taylor remainders. All three block determinants and the generic block factorization are kernel-proved; they have not yet been identified as the complete model's derivative blocks in Lean."
