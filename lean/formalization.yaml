    algebraic_no_go_core_formalized: true
    covered: "Actual differentiable complex field on Euclidean 4-charts and arbitrary four-chart spaces: tensor equals Gram matrix, rank ≤2, and matrix contraction is nonnegative. IntrinsicScalarMetric.lean adds covector-based pointwise tensor, positivity/nullity on arbitrary tangent fibers and exact linear frame-change covariance. Smooth global cotangent-bundle construction from a complex scalar is still open."
    declarations: [ReyesMath.scalarGradientGram_nonnegative, ReyesMath.scalarGradientGram_psd, ReyesMath.scalarGradientGram_no_timelike, ReyesMath.scalarGradientCarrier_gram_entry, ReyesMath.scalarGradientCarrier_rank_le_two, ReyesMath.positive_weighted_gradient_family_psd, ReyesMath.gradient_gram_rank_le_carriers, ReyesMath.complex_gradient_real_identity, ReyesMath.complex_gradient_tensor_eq_gram, ReyesMath.complex_gradient_tensor_rank_le_two, ReyesMath.complex_field_metric_is_gram, ReyesMath.complex_field_metric_rank_le_two, ReyesMath.complex_field_metric_quadratic_nonnegative, ReyesMath.complex_field_metric_no_timelike, ReyesMath.charted_complex_metric_rank_le_two, ReyesMath.charted_complex_metric_no_timelike, ReyesMath.charted_complex_metric_everywhere_obstruction, ReyesMath.charted_complex_metric_matrix_psd, ReyesMath.charted_complex_metric_full_pointwise_obstruction, ReyesMath.gradient_gram_matrix_quadratic, ReyesMath.complex_field_matrix_psd, ReyesMath.complex_field_matrix_no_timelike]
  F09:
    main_theorem_formalized: false
    matrix_nullity_core_formalized: true
    analytic_rank_certificate: docs/SM_V18_ANALYTIC_RANK_CERTIFICATE.md
    analytic_rank_ci: .github/workflows/v18-rank.yml
    covered: "Lean proves nullity >= 20 for every differentiable 31-to-11 map. Separately, a source-pinned model-specific interval-arithmetic certificate proves a nonzero analytic 11x11 Jacobian minor, exact rank 11 and nullity 20 on the frozen v18 active branch. The 31-parameter model and transcendental interval bounds are not yet encoded in Lean."
    declarations: [ReyesMath.elevenByThirtyone_nullity_bound, ReyesMath.nullityBound_arithmetic, ReyesMath.elevenByThirtyOne_matrix_nullity, ReyesMath.rectangular_sensitivity_nullity, ReyesMath.differential_local_identifiability_obstruction]
  F10:
    main_theorem_formalized: true
    modules: [MathProofs/FourierSupport.lean, MathProofs/SphereNull.lean, MathProofs/FourierShellL2.lean]
    covered: "Theorem (zero L^2 state on an isolated Fourier shell) on L^2(R^d), d >= 1, every k_0: for the unitary Fourier transform hat u(xi) = (2 pi)^(-d/2) int u(x) e^(-i x.xi) dx on L^1 cap L^2, extended to L^2 by Plancherel (constructed as the unitary extension of the Schwartz-space transform and identified with the Fourier integral on L^1 cap L^2), supp hat u in the shell |xi| = k_0 implies u = 0, with the support hypothesis read either as essential support or as distributional support. Corollary (free-space Helmholtz equation) for distributional solutions tested against smooth compactly supported functions (via a cutoff approximation of Schwartz functions in the graph norm of the Laplacian); Corollary (nonconstant polynomial dispersion P(-Delta) u = lambda u in S'); the general-multiplier remark; Proposition (fixed carrier, freely varying envelope: mass, Fourier transform, support and width of the modulated packets, and the radial bandwidth bound). The Schwartz-class and supplied-isometry versions (SchwartzShell.lean, L2FourierShellBridge.lean) are retained."
    declarations: [ReyesMath.FourierShell.plancherel, ReyesMath.FourierShell.shell_theorem, ReyesMath.FourierShell.shell_theorem_distrib, ReyesMath.FourierShell.helmholtz, ReyesMath.FourierShell.poly_dispersion, ReyesMath.FourierShell.multiplier, ReyesMath.FourierShell.packets, ReyesMath.Sobolev.fourierL2, ReyesMath.Sobolev.fourierL2_toL2, ReyesMath.Sobolev.fourierL2_ae_eq_fourier, ReyesMath.Sobolev.integral_mul_fourierL2, ReyesMath.Sobolev.FU, ReyesMath.Sobolev.FU_ae_eq, ReyesMath.Sobolev.fourierU, ReyesMath.Sobolev.exists_cutoff_seq, ReyesMath.Sobolev.polyLapS, ReyesMath.Sobolev.fS_polyLapS, ReyesMath.Sobolev.polyZero_null, ReyesMath.Sobolev.packet, ReyesMath.zero_ae_of_null_support, ReyesMath.euclidean_frequency_shell_measure_zero, ReyesMath.euclidean_frequency_shell_ae_zero, ReyesMath.schwartz_fourier_shell_no_bound_state, ReyesMath.l2_fourier_shell_no_bound_state_of_isometry]
  F11:
    main_theorem_formalized: true
    manuscripts:
      e59-dominant-annulus-projection:
        main_theorem_formalized: true
        modules: [MathProofs/TorusFourier.lean]
        covered: "Theorem E59 on T^d = (R/2piZ)^d with the normalized inner product, for the fixed annulus {k in Z^d : ||k| - k_star| <= Delta_k} and any k_star, Delta_k: the projection P A = sum over the annulus of hat A_k e^(ik.x), defined by its L^2-convergent series, is a bounded operator with P^2 = P, P* = P and ||PA|| <= ||A||; it is the orthogonal projection onto H = {B : hat B_k = 0 off the annulus}, which is its range; ||A||^2 = ||PA||^2 + ||(I-P)A||^2; PA is the unique best L^2 approximation to A from H; ||P||_op = 1 if the annulus is nonempty and P = 0 if it is empty. Also the spectral-concentration section (eta = ||PA||^2/||A||^2 in [0,1], eta = 1 iff PA = A), the discrete FFT identity (P = F*DF with F F* = I and a 0/1 diagonal mask is idempotent and self-adjoint), the smooth-multiplier remark (a bounded multiplier is idempotent iff w(k) in {0,1}) and the annulus-convention remark. All operator statements are proved for an arbitrary mask S in Z^d. The Fourier Hilbert basis of L^2((R/LZ)^d) is transported from Mathlib's basis on (R/Z)^d along t -> Lt."
        declarations: [ReyesMath.TorusL2.e59, ReyesMath.TorusL2.e59_fraction, ReyesMath.TorusL2.fft_projector, ReyesMath.TorusL2.mult_idem_iff_mem, ReyesMath.TorusL2.zero_mem_oneSided_not_mem_annulus, ReyesMath.TorusL2.Pk, ReyesMath.TorusL2.Hk, ReyesMath.TorusL2.annulus, ReyesMath.TorusL2.knorm, ReyesMath.TorusL2.P, ReyesMath.TorusL2.H, ReyesMath.TorusL2.P_eq_starProjection, ReyesMath.TorusL2.range_P, ReyesMath.TorusL2.best_approx, ReyesMath.TorusL2.pythagoras, ReyesMath.TorusL2.opNorm_P, ReyesMath.TorusL2.P_empty, ReyesMath.TorusL2.mult, ReyesMath.TorusL2.coef_mult, ReyesMath.TorusL2.adjoint_mult, ReyesMath.TorusL2.basis, ReyesMath.TorusL2.coef, ReyesMath.TorusL2.coef_eq_volume, ReyesMath.TorusL2.emode, ReyesMath.TorusL2.emode_two_pi, ReyesMath.TorusL2.hasSum_series, ReyesMath.TorusL2.hasSum_inner, ReyesMath.TorusL2.hasSum_sq, ReyesMath.TorusL2.ext_coef, ReyesMath.TorusL2.volume_eq_smul_μ]
      spectral-energy-concentration-e62:
        main_theorem_formalized: true
        modules: [MathProofs/TorusFourier.lean, MathProofs/SpectralConcentration.lean]
        covered: "Theorem E62 (discrete spectral concentration): for nonzero A in L^2(T^d) and an arbitrary set of modes, eta is well defined (both series summable, 0 < E_tot), 0 <= eta <= 1, eta = 0 iff hat A_k = 0 on the set, and eta = 1 iff hat A_k = 0 off the set; the Parseval normalization ||A||^2_(L^2(dx)) = (2pi)^d sum |hat A_k|^2 with hat A_k = (2pi)^(-d) int A e^(-ik.x) dx; the projector formulation (eta = ||PA||^2/||A||^2, Pythagoras and the endpoint cases PA = 0, (I-P)A = 0); the sharpness remark; Proposition (continuous spectrum) on L^2(R^d) for the unitary Fourier transform and any measurable B (0 <= eta_B <= 1, eta_B = 0 iff hat A = 0 a.e. on B, eta_B = 1 iff hat A = 0 a.e. off B); the zero-width-shell remark (eta of an exact sphere is 0); the no-monotonicity example eta(t) = cos^2 t."
        declarations: [ReyesMath.TorusL2.e62, ReyesMath.TorusL2.e62_parseval, ReyesMath.TorusL2.eta, ReyesMath.TorusL2.Estar, ReyesMath.TorusL2.Etot, ReyesMath.TorusL2.eta_eq, ReyesMath.TorusL2.eta_proj, ReyesMath.TorusL2.eta_basis_mem, ReyesMath.TorusL2.eta_basis_not_mem, ReyesMath.TorusL2.eta_not_monotone, ReyesMath.SpectralConc.e62_continuous, ReyesMath.SpectralConc.etaC, ReyesMath.SpectralConc.etaC_sphere]
      e16-linear-spectral-concentration:
